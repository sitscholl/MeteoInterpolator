general:
  require_stations_in_aoi: true
  timezone: Europe/Rome

meteo_data:
  handler: province_api
  stations: ['02500MS', '09700MS', '15800MS', '19300MS', '23200MS', '25900MS', '34500MS', '37100MS', '39100MS',
              '41000MS', '44500MS', '50500MS', '56900MS', '59700MS', '65600MS', '66500MS', '73500MS',
              '74900MS', '75600MS', '82200MS', '83200MS', '85120MS', '86900MS', '88820MS']

base_grid:
  path: "https://files.isimip.org/ISIMIP3a/InputData/climate/atmosphere/obsclim/global/daily/historical/CHELSA-W5E5/chelsa-w5e5_obsclim_orog_30arcsec_global.nc#mode=bytes"
  var: orog
  original_crs: 4326
  target_crs: 32532
  aoi_buffer_m: 5000

cache:
  enabled: true
  cache_dir: data/cache

aoi:
  minx: 10
  miny: 46
  maxx: 12
  maxy: 47

interpolation:
  min_sample_size: 3

  vertical_model:
    type: nonlinear
    fit_method: "trf"
    fit_initial_params: True
    initial_params_elev_threshold: 1500

  distance:
    type: path_distance
    connectivity_type: 4
    lam_values: [0, 25, 50, 75, 100, 150, 200]
    max_visibility_distance: null

  inverse_distance_weighting:
    neighbours: 4
    weight_exponent: 2

cross_validation:
  enabled: true
  cv: loo
  scoring: [mae, rmse, bias]
  scopes: [overall]
  refit_vertical_per_fold: false
  select_by: mae
  select_scope: overall
  apply_best_params: true
  param_grid:
    lambda: [0, 25, 50, 75, 100, 150, 200]

cache:
  enabled: true
  cache_dir: data/cache

output:
  format: tiff
  options:
    path: data/results
