meteo_data:
  # handler: province_api
  # stations: ['02500MS', '09700MS', '15800MS', '19300MS', '23200MS', '25900MS', '34500MS', '37100MS', '39100MS',
  #             '41000MS', '44500MS', '50500MS', '56900MS', '59700MS', '65600MS', '66500MS', '73500MS',
  #             '74900MS', '75600MS', '82200MS', '83200MS', '85120MS', '86900MS', '88820MS']
  handler: local_file
  station_metadata_path: data/province/stations.csv
  observations_path: data/province/station_files/*.csv
  timezone: Europe/Rome

resampling:
  target_freq: D
  min_coverage: 0.4

dem:
  #path: "https://files.isimip.org/ISIMIP3a/InputData/climate/atmosphere/obsclim/global/daily/historical/CHELSA-W5E5/chelsa-w5e5_obsclim_orog_30arcsec_global.nc#mode=bytes"
  path: data/dem_envelope_1000m.tif
  var: null
  crs: null

cache:
  enabled: true
  cache_dir: data/cache

interpolation:
  min_sample_size: 3

  vertical_model:
    type: nonlinear
    fit_method: "trf"
    fit_initial_params: True
    initial_params_elev_threshold: 1500

  distance:
    type: path_distance
    connectivity_type: 4
    lam_values: [0, 25, 50, 75, 100, 125, 150, 175, 200]
    max_visibility_distance: 10000

  inverse_distance_weighting:
    neighbours: 4
    weight_exponent: 2

cross_validation:
  enabled: true
  cv: loo
  scoring: [mae, rmse, bias]
  scopes: [overall]
  refit_vertical_per_fold: false
  select_by: mae
  select_scope: overall
  # Stop the lambda search after this relative score improvement stalls.
  # A value of 0.10 means later lambdas must improve the selected score by at least 10%.
  # Set to null or omit to evaluate every lambda.
  min_lambda_improvement: 0.10
  lambda_improvement_patience: 2
  lambda_improvement_mode: relative
  param_grid:
    lambda: [0, 25, 50, 75, 100, 125, 150, 175, 200]
    #lambda: [100]

output:
  format: tiff
  options:
    root: data/results
    # filename_pattern supports {var}, {variable}, {date}, {param}, and {suffix}
    filename_pattern: "{date}_{var}"
    # date_format defaults from resampling.target_freq, e.g. "%Y-%m-%d" for daily output.
    # date_format: "%Y%m%d"
